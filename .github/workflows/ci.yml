name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: Tests
        run: zsh tests/run.zsh

      - name: Formula style
        run: brew style Formula/php-dev.rb
